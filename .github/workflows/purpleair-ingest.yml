name: Ingesta PurpleAir

on:
  schedule:
    - cron: "*/15 * * * *"   # cada 15 minutos, ajustá según necesites
  workflow_dispatch: {}       # permite correrlo a mano desde GitHub

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python ingest_purpleair.py
        env:
          PURPLEAIR_API_KEY: ${{ secrets.PURPLEAIR_API_KEY }}
          SENSOR_INDEXES: ${{ secrets.SENSOR_INDEXES }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
