name: Ingesta PurpleAir (automática + manual)

# Historia (ver README.md → "Historia de la ingesta automática" para el
# detalle completo): esto corría con schedule cada 15 min, se sacó en
# agosto 2026 al migrar la ingesta a un Cron Trigger de Cloudflare
# (worker/wrangler.toml, worker/src/index.js), y se volvió a activar días
# después porque ese Cron Trigger quedó registrado pero nunca disparó
# scheduled() (parece un bug del lado de Cloudflare, no de este repo).
#
# Corre en los minutos :07/:22/:37/:52 — a propósito NO coincide con los
# minutos del Cron Trigger de Cloudflare (:03/:18/:33/:48) ni con los del
# cron externo en cron-job.org (:12/:27/:42/:57), que se sumó como tercera
# capa de respaldo. Los tres pueden correr en paralelo sin duplicar datos
# gracias al INSERT OR IGNORE + UNIQUE(sensor_index, timestamp) en
# schema.sql. workflow_dispatch se mantiene para backfill puntual a mano.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python ingest_purpleair.py
        env:
          PURPLEAIR_API_KEY: ${{ secrets.PURPLEAIR_API_KEY }}
          SENSOR_INDEXES: ${{ secrets.SENSOR_INDEXES }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
