name: Ingesta PurpleAir (manual / respaldo)

# Sin "schedule:" a propósito: la ingesta automática cada 15 min pasó a un
# Cron Trigger de Cloudflare (worker/wrangler.toml, worker/src/index.js),
# que no depende de la cola de scheduled events de GitHub Actions (la causa
# más probable de las corridas salteadas que tenía este workflow). Este
# Action queda solo para correr una ingesta puntual a mano si hace falta
# (ej. backfill, o el Worker caído) via workflow_dispatch.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python ingest_purpleair.py
        env:
          PURPLEAIR_API_KEY: ${{ secrets.PURPLEAIR_API_KEY }}
          SENSOR_INDEXES: ${{ secrets.SENSOR_INDEXES }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
