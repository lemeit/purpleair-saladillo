<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aire Saladillo · Calidad de aire en instituciones educativas</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0b0e13;
    --bg-panel: #12161e;
    --bg-panel-hover: #171c26;
    --border: #232936;
    --text: #e6e9ef;
    --text-dim: #8b93a3;
    --accent: #6ee7b7;
    --accent-dim: #2f4a41;
    --good: #6ee7b7;
    --moderate: #f5d565;
    --unhealthy-sg: #f0a35d;
    --unhealthy: #ef7b7b;
    --font-display: "JetBrains Mono", monospace;
    --font-body: "Sora", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    line-height: 1.5;
  }

  header {
    padding: 48px 32px 32px;
    border-bottom: 1px solid var(--border);
  }

  .eyebrow {
    font-family: var(--font-display);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(28px, 4vw, 42px);
    letter-spacing: -0.01em;
  }

  header p {
    color: var(--text-dim);
    margin-top: 10px;
    max-width: 560px;
    font-size: 15px;
  }

  main {
    padding: 32px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .status-bar {
    display: flex;
    gap: 8px;
    align-items: center;
    font-family: var(--font-display);
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 24px;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    margin-bottom: 40px;
  }

  .card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }

  .card:hover {
    background: var(--bg-panel-hover);
    border-color: var(--accent-dim);
  }

  .card.selected {
    border-color: var(--accent);
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
  }

  .card-name {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 14px;
  }

  .card-sub {
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 4px;
  }

  .badge {
    font-family: var(--font-display);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    white-space: nowrap;
  }

  .aqi-value {
    font-family: var(--font-display);
    font-size: 36px;
    font-weight: 700;
    line-height: 1;
  }

  .aqi-label {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 6px;
  }

  .metrics-row {
    display: flex;
    gap: 16px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  .metric {
    font-size: 12px;
  }

  .metric-value {
    font-family: var(--font-display);
    font-size: 14px;
    color: var(--text);
  }

  .metric-label {
    color: var(--text-dim);
    margin-top: 2px;
  }

  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
  }

  .panel-title {
    font-family: var(--font-display);
    font-size: 14px;
    color: var(--text-dim);
    margin-bottom: 20px;
  }

  .chart-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
  }

  .controls-right {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .range-buttons {
    display: flex;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }

  .range-btn {
    font-family: var(--font-display);
    font-size: 12px;
    color: var(--text-dim);
    background: transparent;
    border: none;
    padding: 6px 14px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  .range-btn:hover {
    background: var(--bg-panel-hover);
  }

  .range-btn.active {
    background: var(--accent-dim);
    color: var(--accent);
  }

  .export-btn {
    font-family: var(--font-display);
    font-size: 12px;
    color: var(--text-dim);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 14px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }

  .export-btn:hover {
    border-color: var(--accent-dim);
    color: var(--accent);
  }

  .channel-toggle {
    display: flex;
    gap: 16px;
    margin-top: 12px;
    font-family: var(--font-display);
    font-size: 11px;
    color: var(--text-dim);
  }

  .channel-toggle label {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }

  .empty-state {
    text-align: center;
    color: var(--text-dim);
    padding: 60px 20px;
    font-size: 14px;
  }

  footer {
    text-align: center;
    padding: 32px;
    color: var(--text-dim);
    font-size: 12px;
    font-family: var(--font-display);
  }

  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>

<header>
  <div class="eyebrow">lemeit.ar / aire</div>
  <h1>Calidad de aire — Saladillo</h1>
  <p>Red de sensores PurpleAir instalados en escuelas y jardines de infantes de la ciudad, monitoreando material particulado en tiempo real.</p>
</header>

<main>
  <div class="status-bar">
    <span class="dot"></span>
    <span id="status-text">Cargando datos...</span>
  </div>

  <div class="grid" id="sensor-grid"></div>

  <div class="panel">
    <div class="chart-controls">
      <div class="panel-title" id="chart-title" style="margin-bottom:0;">Seleccioná una institución para ver el histórico</div>
      <div class="controls-right">
        <div class="range-buttons" id="range-buttons">
          <button class="range-btn active" data-range="24h">24h</button>
          <button class="range-btn" data-range="7d">7d</button>
          <button class="range-btn" data-range="30d">30d</button>
        </div>
        <button class="export-btn" id="export-btn">Exportar CSV</button>
      </div>
    </div>
    <canvas id="history-chart" height="90"></canvas>
    <div class="channel-toggle">
      <label><input type="checkbox" id="toggle-channels" /> Mostrar canales A/B por separado</label>
    </div>
  </div>
</main>

<footer>
  Proyecto lemeit.ar · datos de <a href="https://www.purpleair.com" target="_blank">PurpleAir</a>
</footer>

<script>
  // Reemplazar por la URL real una vez desplegado el Worker
  // (ej: https://purpleair-saladillo-api.TU-SUBDOMINIO.workers.dev)
  const API_BASE = "https://purpleair-saladillo-api.fisicai-eureka-01.workers.dev";

  let chart = null;
  let currentSensorIndex = null;
  let currentLabel = "";
  let currentRange = "24h";
  let currentRows = [];

  const AQI_BANDS = [
    { from: 0, to: 50, color: "rgba(110,231,183,0.10)" },
    { from: 50, to: 100, color: "rgba(245,213,101,0.08)" },
    { from: 100, to: 150, color: "rgba(240,163,93,0.08)" },
    { from: 150, to: 300, color: "rgba(239,123,123,0.08)" },
  ];

  const aqiBandsPlugin = {
    id: "aqiBands",
    beforeDraw(c) {
      const { ctx, chartArea, scales } = c;
      if (!chartArea) return;
      const yScale = scales.y;
      ctx.save();
      AQI_BANDS.forEach((band) => {
        const yFrom = yScale.getPixelForValue(pm25FromAqi(band.to));
        const yTo = yScale.getPixelForValue(pm25FromAqi(band.from));
        ctx.fillStyle = band.color;
        ctx.fillRect(chartArea.left, yFrom, chartArea.right - chartArea.left, yTo - yFrom);
      });
      ctx.restore();
    },
  };

  function pm25FromAqi(aqi) {
    // Inverso aproximado de pm25ToAqi, solo para dibujar las bandas de fondo
    const breakpoints = [
      [0, 12, 0, 50], [12.1, 35.4, 51, 100], [35.5, 55.4, 101, 150],
      [55.5, 150.4, 151, 200], [150.5, 250.4, 201, 300],
    ];
    for (const [cLo, cHi, iLo, iHi] of breakpoints) {
      if (aqi >= iLo && aqi <= iHi) {
        return ((cHi - cLo) / (iHi - iLo)) * (aqi - iLo) + cLo;
      }
    }
    return 250;
  }

  function toBsAs(timestampStr) {
    // El timestamp viene de D1 como "YYYY-MM-DD HH:MM:SS" en UTC, sin sufijo de zona.
    // Le agregamos "Z" para que JS lo interprete como UTC antes de convertir.
    const iso = timestampStr.replace(" ", "T") + "Z";
    return new Date(iso);
  }

  function formatBsAsTime(timestampStr) {
    return toBsAs(timestampStr).toLocaleTimeString("es-AR", {
      timeZone: "America/Argentina/Buenos_Aires",
      hour: "2-digit",
      minute: "2-digit",
    });
  }

  function formatBsAsFull(timestampStr) {
    return toBsAs(timestampStr).toLocaleString("es-AR", {
      timeZone: "America/Argentina/Buenos_Aires",
      day: "2-digit",
      month: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
    });
  }

  function aqiInfo(aqi) {
    if (aqi == null) return { label: "Sin dato", color: "var(--text-dim)", bg: "transparent" };
    if (aqi <= 50) return { label: "Buena", color: "var(--good)", bg: "rgba(110,231,183,0.12)" };
    if (aqi <= 100) return { label: "Moderada", color: "var(--moderate)", bg: "rgba(245,213,101,0.12)" };
    if (aqi <= 150) return { label: "Grupos sensibles", color: "var(--unhealthy-sg)", bg: "rgba(240,163,93,0.12)" };
    return { label: "No saludable", color: "var(--unhealthy)", bg: "rgba(239,123,123,0.12)" };
  }

  function pm25ToAqi(pm) {
    // Aproximación EPA simplificada por tramos
    if (pm == null) return null;
    const breakpoints = [
      [0, 12, 0, 50], [12.1, 35.4, 51, 100], [35.5, 55.4, 101, 150],
      [55.5, 150.4, 151, 200], [150.5, 250.4, 201, 300],
    ];
    for (const [cLo, cHi, iLo, iHi] of breakpoints) {
      if (pm >= cLo && pm <= cHi) {
        return Math.round(((iHi - iLo) / (cHi - cLo)) * (pm - cLo) + iLo);
      }
    }
    return 300;
  }

  async function loadSensors() {
    try {
      const res = await fetch(`${API_BASE}/api/ultimas`);
      const data = await res.json();
      renderGrid(data);
      document.getElementById("status-text").textContent =
        `${data.length} sensor${data.length === 1 ? "" : "es"} activo${data.length === 1 ? "" : "s"} · actualizado cada 15 min`;
    } catch (err) {
      document.getElementById("status-text").textContent = "No se pudo conectar con la API";
      console.error(err);
    }
  }

  function renderGrid(sensors) {
    const grid = document.getElementById("sensor-grid");
    grid.innerHTML = "";

    if (!sensors.length) {
      grid.innerHTML = `<div class="empty-state">Todavía no hay lecturas guardadas.</div>`;
      return;
    }

    sensors.forEach((s) => {
      const aqi = pm25ToAqi(s.pm2_5);
      const info = aqiInfo(aqi);

      const card = document.createElement("div");
      card.className = "card";
      card.dataset.sensorIndex = s.sensor_index;
      card.innerHTML = `
        <div class="card-top">
          <div>
            <div class="card-name">${s.institucion || s.nombre}</div>
            <div class="card-sub">${s.nombre}</div>
          </div>
          <span class="badge" style="color:${info.color}; background:${info.bg}">${info.label}</span>
        </div>
        <div class="aqi-value" style="color:${info.color}">${aqi ?? "—"}</div>
        <div class="aqi-label">Índice de calidad de aire (AQI)</div>
        <div class="metrics-row">
          <div class="metric">
            <div class="metric-value">${s.pm2_5 ?? "—"} µg/m³</div>
            <div class="metric-label">PM2.5</div>
          </div>
          <div class="metric">
            <div class="metric-value">${s.temperatura ?? "—"}°C</div>
            <div class="metric-label">Temp.</div>
          </div>
          <div class="metric">
            <div class="metric-value">${s.humedad ?? "—"}%</div>
            <div class="metric-label">Humedad</div>
          </div>
        </div>
        <div class="card-sub" style="margin-top:12px; padding-top:12px; border-top:1px solid var(--border);">
          Actualizado ${formatBsAsFull(s.timestamp)} (ARG)
        </div>
      `;
      card.addEventListener("click", () => selectSensor(s.sensor_index, s.institucion || s.nombre, card));
      grid.appendChild(card);
    });

    // Selecciona el primero por defecto
    const first = grid.querySelector(".card");
    if (first) first.click();
  }

  async function selectSensor(sensorIndex, label, cardEl) {
    document.querySelectorAll(".card").forEach((c) => c.classList.remove("selected"));
    cardEl.classList.add("selected");
    currentSensorIndex = sensorIndex;
    currentLabel = label;
    document.getElementById("chart-title").textContent = `Histórico PM2.5 — ${label}`;
    await loadHistory();
  }

  async function loadHistory() {
    if (currentSensorIndex == null) return;
    try {
      const res = await fetch(`${API_BASE}/api/historico/${currentSensorIndex}?range=${currentRange}`);
      const data = await res.json();
      currentRows = data; // ya vienen en orden cronológico ascendente
      renderChart(currentRows);
    } catch (err) {
      console.error(err);
    }
  }

  function renderChart(rows) {
    const ctx = document.getElementById("history-chart");
    const labels = rows.map((r) => formatBsAsTime(r.timestamp));
    const values = rows.map((r) => r.pm2_5);
    const showChannels = document.getElementById("toggle-channels").checked;

    const datasets = [{
      label: "PM2.5 promedio (µg/m³)",
      data: values,
      borderColor: "#6ee7b7",
      backgroundColor: "rgba(110,231,183,0.08)",
      borderWidth: 2,
      pointRadius: 0,
      tension: 0.3,
      fill: true,
    }];

    if (showChannels) {
      datasets.push(
        {
          label: "Canal A",
          data: rows.map((r) => r.pm2_5_a),
          borderColor: "rgba(110,231,183,0.5)",
          borderWidth: 1,
          borderDash: [4, 3],
          pointRadius: 0,
          fill: false,
        },
        {
          label: "Canal B",
          data: rows.map((r) => r.pm2_5_b),
          borderColor: "rgba(240,163,93,0.6)",
          borderWidth: 1,
          borderDash: [4, 3],
          pointRadius: 0,
          fill: false,
        }
      );
    }

    if (chart) chart.destroy();
    chart = new Chart(ctx, {
      type: "line",
      data: { labels, datasets },
      plugins: [aqiBandsPlugin],
      options: {
        responsive: true,
        plugins: { legend: { display: showChannels, labels: { color: "#8b93a3", font: { family: "JetBrains Mono", size: 10 } } } },
        scales: {
          x: { ticks: { color: "#8b93a3", font: { family: "JetBrains Mono", size: 10 }, maxTicksLimit: 12 }, grid: { color: "#232936" } },
          y: { ticks: { color: "#8b93a3", font: { family: "JetBrains Mono", size: 10 } }, grid: { color: "#232936" } },
        },
      },
    });
  }

  function exportCsv() {
    if (!currentRows.length) return;
    const headers = ["timestamp_utc", "pm1_0", "pm2_5", "pm2_5_a", "pm2_5_b", "pm10_0", "temperatura_c", "humedad", "presion", "rssi"];
    const lines = [headers.join(",")];
    currentRows.forEach((r) => {
      lines.push(headers.map((h) => r[h.replace("_utc", "").replace("_c", "")] ?? "").join(","));
    });
    const blob = new Blob([lines.join("\n")], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${currentLabel.replace(/\s+/g, "_")}_${currentRange}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  document.getElementById("export-btn").addEventListener("click", exportCsv);
  document.getElementById("toggle-channels").addEventListener("change", () => renderChart(currentRows));
  document.querySelectorAll(".range-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".range-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      currentRange = btn.dataset.range;
      loadHistory();
    });
  });

  loadSensors();
  setInterval(loadSensors, 5 * 60 * 1000); // refresca cada 5 min
</script>

</body>
</html>
